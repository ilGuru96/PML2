<!doctype html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>PokeMisteryRL</title>

<link rel="stylesheet" href="./game.css?v=mobile-formation-drag-20260910-36">
<link rel="stylesheet" href="./core/features/scene-layout.css?v=scene-layout-1">
</head>

<body>

<main id="gameBox">

  <!-- MENU -->
  <section id="menu">
    <div class="menu-box home-alpha-menu">
      <div class="home-alpha-brand" aria-label="PokemonMD RogueLike, versione Alpha">
        <span>PokemonMD</span>
        <strong>RogueLike</strong>
        <em>VerAlpha</em>
      </div>
      <div id="homeActions" class="home-alpha-actions">
        <button type="button" id="test2CampaignButton" class="home-alpha-button home-alpha-start"><b class="home-action-title">BETA</b><small>AVVIA IL CORE</small></button>
        <button type="button" class="home-alpha-button home-alpha-guide" onclick="openGuideMenu()"><b>GUIDA</b><small>COME GIOCARE</small></button>
      </div>
    </div>
  </section>

  <!-- GAME -->
  <section id="game" class="hidden">

    <main class="main-layout">
      <div class="adventure-shell">
      <div class="map-wrap">

        <svg
          id="mapSvg"
          aria-hidden="true"
        ></svg>

        <div
          id="map"
          aria-label="Mappa della run"
        ></div>

        <button id="mapFloorButton" type="button" aria-label="Piano corrente" title="Piano corrente">PIANO: 1</button>
        <div class="map-utility-actions">
          <button id="mapBackpackButton" type="button" onclick="toggleInventory()" aria-label="Apri o chiudi zaino" title="Zaino">🎒</button>
          <button id="mapMenuButton" type="button" onclick="goMenu()" aria-label="Torna al menu" title="Menu">☰</button>
          <button id="mapResetButton" type="button" onclick="quickReset()" aria-label="Ricomincia la run" title="Reset run">↻</button>
        </div>

      </div>

      <!-- Il CORE costruisce qui il pannello inferiore, nello stesso scenario della mappa. -->
      <div id="bottomContainer"></div>
      </div>
    </main>

  </section>

  <!-- MODALE PRINCIPALE -->
  <div id="modal" class="hidden">
    <div id="modalContent"></div>
  </div>

  <!-- PREVIEW POKÉMON -->
  <div id="pokePreview" class="hidden">
    <div class="preview-box">

      <button type="button" class="pp-close" onclick="closeTeamPreview();busy=0;PokeMisteryRL.UI.render();">✕</button>
      <header class="pp-profile-head">
        <div class="pp-sprite-frame"><img id="ppSprite" src="" alt=""></div>
        <div class="pp-identity"><span id="ppLevel">LV 1</span><h2 id="ppName">—</h2><div id="ppTypes"></div></div>
      </header>
      <section class="pp-health"><div class="pp-health-label"><b>PS</b><span id="ppHpText">0/0</span></div><div class="bar"><div id="ppHpFill" style="width:100%"></div></div></section>
      <section class="pp-stats"><div><small>ATTACCO</small><b id="ppk">0</b></div><div><small>DIFESA</small><b id="ppDef">0</b></div><div><small>VELOCITÀ</small><b id="ppSpd">0</b></div></section>
      <div id="ppCustomContent"></div>

    </div>
  </div>

  <!-- INFO POKÉMON -->
  <div id="pokeInfo" class="hidden">

    <div class="modal-box">

      <div style="text-align:center">

        <img
          id="pokeInfoSprite"
          src=""
          alt=""
          style="
            width:80px;
            height:80px;
            object-fit:contain;
            image-rendering:pixelated
          "
        >

        <h2 id="pokeInfoName">—</h2>

        <div id="pokeInfoTypes"></div>

      </div>

      <p>
        HP <span id="piHp">0/0</span>
      </p>

      <p>
        ATK
        <span id="piAtk">0</span>
        <span id="piAtkR"></span>
      </p>

      <p>
        DEF
        <span id="piDef">0</span>
        <span id="piDefR"></span>
      </p>

      <p>
        SPD
        <span id="piSpd">0</span>
        <span id="piSpdR"></span>
      </p>

      <p>
        CRIT <span id="piCrit">0</span>
      </p>

      <p>
        EVA <span id="piEva">0</span>
      </p>

      <p>
        STUN <span id="piStun">0</span>
      </p>

      <div id="pokeInfoActions"></div>

      <button
        type="button"
        onclick="closePokeInfo()"
      >
        CHIUDI
      </button>

    </div>

  </div>

</main>

<div id="fatal"></div>

<!-- =========================================================
     FILE DEL REPOSITORY
     ========================================================= -->

<script src="./core/data/modes.js?v=forest-only-20260909-02"></script>
<script src="./core/data/config.js?v=module-config-20260907-1"></script>
<script src="./core/data/types.js?v=module-types-20260907-1"></script>
<script src="./core/data/test2-map-profile.js?v=mobile-qa-20260908-1"></script>
<script src="./core/features/scene-layout.js?v=scene-layout-5"></script>
<script src="./core/features/boss-waves.js"></script>
<script src="./texts.js?v=starter-gameover-20260909-3"></script>

<!-- CORE 1 FIXATO -->
<script src="./core/features/type-cards.js?v=module-cards-20260907-1"></script>
<script src="./core/core.js?v=mobile-formation-drag-20260910-52"></script>
<script src="./core/features/node-flow.js?v=node-flow-1"></script>
<script src="./core/features/recruitment.js?v=module-recruitment-20260907-1"></script>
<script src="./core/features/shop.js?v=scene-shop-20260908-2"></script>
<script src="./core/features/guide-ui.js?v=target-columns-20260909-2"></script>

<!-- REGIONI -->
<script src="./core/systems/level-system.js"></script>
<script src="./core/systems/skill-system.js"></script>
<script src="./core/data/items.js"></script>
<script src="./core/systems/items/item-effects.js"></script>
<script src="./core/systems/ui/backpack-policy.js?v=node-gate-20260909-5"></script>
<script src="./features/end-floor-boost.js"></script>
<script src="./features/start-selection-guard.js"></script>
<script src="./features/rescue-prompt-guard.js"></script>

<script>
/*
 * Controllo leggero post-caricamento.
 * Non costruisce una seconda mappa e non sostituisce nessuna funzione del CORE.
 */
window.addEventListener("error", function(e){
  const box = document.getElementById("fatal");
  if(!box) return;

  box.style.display = "block";
  box.textContent =
    "ERRORE JAVASCRIPT\n\n" +
    (e.error?.stack || e.message || String(e.error || e));
});

window.addEventListener("unhandledrejection", function(e){
  const box = document.getElementById("fatal");
  if(!box) return;

  box.style.display = "block";
  box.textContent =
    "PROMISE REJECTION\n\n" +
    (e.reason?.stack || e.reason || String(e.reason));
});

console.log("PokeMisteryRL");
console.log("Mosse live PokeAPI: attive");
console.log("CORE 1 ready:", !!window.PokeMisteryRL_CoreBridge?.part1Ready);
console.log("CORE 2 ready:", !!window.PokeMisteryRL_CoreBridge?.part2Ready);
console.log("startPokemon:", typeof window.PokeMisteryRL?.Run?.startPokemon);

(function(){
  const test2CampaignButton = document.getElementById("test2CampaignButton");

  const startKantoAdventure = async function(starterId, modeName = "test2"){
    try {
      const launch = document.getElementById("test2CampaignButton");
      if(launch){ launch.disabled = true; const title = launch.querySelector(".home-action-title"); if(title) title.textContent = "CARICAMENTO"; }
      await window.PokeMisteryRL?.Database?.loadPokeApiInitialDatabase?.();
      if(
        !window.PokeMisteryRL ||
        !window.PokeMisteryRL.Run ||
        typeof window.PokeMisteryRL.Run.startPokemon !== "function"
      ){
        throw new Error(
          "PokeMisteryRL.Run.startPokemon() non disponibile."
        );
      }

      window.PokeMisteryRL.Run.startPokemon(starterId, modeName);
      if(window.PKM_RUN){
        window.PKM_RUN.region = "kanto";
      }
      if(modeName === "test2" && starterId == null){
        window.PokeMisteryRL.Progress?.openStartingStarterChoice?.();
      }
    } catch(err) {
      const box = document.getElementById("fatal");
      if(box){
        box.style.display = "block";
        box.textContent =
          "ERRORE DURANTE LA RUN\n\n" +
          (err?.stack || err?.message || String(err));
      }
      console.error(err);
    } finally {
      const launch = document.getElementById("test2CampaignButton");
      if(launch){ launch.disabled = false; const title = launch.querySelector(".home-action-title"); if(title) title.textContent = "BETA"; }
    }
  };

  window.chooseCampaignStarter = function(starterId){
    // Una scelta non valida non deve mai riavviare o sostituire la run.
    return window.PokeMisteryRL.Progress?.chooseStartingStarter?.(Number(starterId)) || false;
  };
  test2CampaignButton?.addEventListener("click", () => startKantoAdventure(null, "test2"));
})();
</script>


</body></html>
