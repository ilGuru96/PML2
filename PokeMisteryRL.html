<!doctype html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>PokeMisteryRL</title>

<link rel="stylesheet" href="./PokeMisteryRL.css">
</head>

<body>

<main id="gameBox">

  <!-- MENU -->
  <section id="menu">
    <div class="menu-box">
      <h1>⚡ PokeMisteryRL</h1>
      <p>Campagna sperimentale</p>
      <div id="homeActions">
        <button type="button" id="test2CampaignButton" class="region-choice campaign-choice">
          🧩 TEST2
          <small>Inizia la campagna</small>
        </button>
      </div>
    </div>
  </section>

  <!-- GAME -->
  <section id="game" class="hidden">

    <main class="main-layout">
      <div class="adventure-shell">
      <div class="map-wrap">

        <svg
          id="mapSvg"
          aria-hidden="true"
        ></svg>

        <div
          id="map"
          aria-label="Mappa della run"
        ></div>

        <button id="mapFloorButton" type="button" aria-label="Piano corrente" title="Piano corrente">PIANO: 1</button>
        <div class="map-utility-actions">
          <button id="mapBackpackButton" type="button" onclick="toggleInventory()" aria-label="Apri o chiudi zaino" title="Zaino">🎒</button>
          <button id="mapMenuButton" type="button" onclick="goMenu()" aria-label="Torna al menu" title="Menu">☰</button>
          <button id="mapResetButton" type="button" onclick="quickReset()" aria-label="Ricomincia la run" title="Reset run">↻</button>
        </div>

      </div>

      <!-- Il CORE costruisce qui il pannello inferiore, nello stesso scenario della mappa. -->
      <div id="bottomContainer"></div>
      </div>
    </main>

  </section>

  <!-- MODALE PRINCIPALE -->
  <div id="modal" class="hidden">
    <div id="modalContent"></div>
  </div>

  <!-- PREVIEW POKÉMON -->
  <div id="pokePreview" class="hidden">
    <div class="preview-box">

      <button type="button" class="pp-close" onclick="closeTeamPreview();busy=0;PokeMisteryRL.UI.render();">✕</button>
      <header class="pp-profile-head">
        <div class="pp-sprite-frame"><img id="ppSprite" src="" alt=""></div>
        <div class="pp-identity"><span id="ppLevel">LV 1</span><h2 id="ppName">—</h2><div id="ppTypes"></div></div>
      </header>
      <section class="pp-health"><div class="pp-health-label"><b>PS</b><span id="ppHpText">0/0</span></div><div class="bar"><div id="ppHpFill" style="width:100%"></div></div></section>
      <section class="pp-stats"><div><small>ATTACCO</small><b id="ppk">0</b></div><div><small>DIFESA</small><b id="ppDef">0</b></div><div><small>VELOCITÀ</small><b id="ppSpd">0</b></div></section>
      <div id="ppCustomContent"></div>

    </div>
  </div>

  <!-- INFO POKÉMON -->
  <div id="pokeInfo" class="hidden">

    <div class="modal-box">

      <div style="text-align:center">

        <img
          id="pokeInfoSprite"
          src=""
          alt=""
          style="
            width:80px;
            height:80px;
            object-fit:contain;
            image-rendering:pixelated
          "
        >

        <h2 id="pokeInfoName">—</h2>

        <div id="pokeInfoTypes"></div>

      </div>

      <p>
        HP <span id="piHp">0/0</span>
      </p>

      <p>
        ATK
        <span id="piAtk">0</span>
        <span id="piAtkR"></span>
      </p>

      <p>
        DEF
        <span id="piDef">0</span>
        <span id="piDefR"></span>
      </p>

      <p>
        SPD
        <span id="piSpd">0</span>
        <span id="piSpdR"></span>
      </p>

      <p>
        CRIT <span id="piCrit">0</span>
      </p>

      <p>
        EVA <span id="piEva">0</span>
      </p>

      <p>
        STUN <span id="piStun">0</span>
      </p>

      <div id="pokeInfoActions"></div>

      <button
        type="button"
        onclick="closePokeInfo()"
      >
        CHIUDI
      </button>

    </div>

  </div>

</main>

<div id="fatal"></div>

<!-- =========================================================
     FILE DEL REPOSITORY
     ========================================================= -->

<script src="./DB_MODES.js"></script>

<!-- CORE 1 FIXATO -->
<script src="./CORE_0.js"></script>

<!-- REGIONI -->
<script src="./LEVEL_SYSTEM_REGION.js"></script>
<script src="./SKILL_SYSTEM_REGION.js"></script>
<script src="./DB_ITEMS.js"></script>
<script src="./systems/items/item-effects.js"></script>
<script src="./systems/ui/backpack-policy.js"></script>

<script>
/*
 * Controllo leggero post-caricamento.
 * Non costruisce una seconda mappa e non sostituisce nessuna funzione del CORE.
 */
window.addEventListener("error", function(e){
  const box = document.getElementById("fatal");
  if(!box) return;

  box.style.display = "block";
  box.textContent =
    "ERRORE JAVASCRIPT\n\n" +
    (e.error?.stack || e.message || String(e.error || e));
});

window.addEventListener("unhandledrejection", function(e){
  const box = document.getElementById("fatal");
  if(!box) return;

  box.style.display = "block";
  box.textContent =
    "PROMISE REJECTION\n\n" +
    (e.reason?.stack || e.reason || String(e.reason));
});

console.log("PokeMisteryRL");
console.log("Mosse live PokeAPI: attive");
console.log("CORE 1 ready:", !!window.PokeMisteryRL_CoreBridge?.part1Ready);
console.log("CORE 2 ready:", !!window.PokeMisteryRL_CoreBridge?.part2Ready);
console.log("startPokemon:", typeof window.PokeMisteryRL?.Run?.startPokemon);

(function(){
  const test2CampaignButton = document.getElementById("test2CampaignButton");

  const startKantoAdventure = async function(starterId, modeName = "test2"){
    try {
      const launch = document.getElementById("test2CampaignButton");
      if(launch){ launch.disabled = true; launch.firstChild.textContent = "⌛ CARICAMENTO POKÉAPI "; }
      await window.PokeMisteryRL?.Database?.loadPokeApiInitialDatabase?.();
      if(
        !window.PokeMisteryRL ||
        !window.PokeMisteryRL.Run ||
        typeof window.PokeMisteryRL.Run.startPokemon !== "function"
      ){
        throw new Error(
          "PokeMisteryRL.Run.startPokemon() non disponibile."
        );
      }

      window.PokeMisteryRL.Run.startPokemon(starterId, modeName);
      if(window.PKM_RUN){
        window.PKM_RUN.region = "kanto";
      }
    } catch(err) {
      const box = document.getElementById("fatal");
      if(box){
        box.style.display = "block";
        box.textContent =
          "ERRORE DURANTE LA RUN\n\n" +
          (err?.stack || err?.message || String(err));
      }
      console.error(err);
    } finally {
      const launch = document.getElementById("test2CampaignButton");
      if(launch){ launch.disabled = false; launch.firstChild.textContent = "🧩 TEST2 "; }
    }
  };

  window.chooseCampaignStarter = function(starterId){
    startKantoAdventure(Number(starterId), "test2");
  };
  test2CampaignButton?.addEventListener("click", () => startKantoAdventure(null, "test2"));
})();
</script>

</body>
</html>

 <style>
/* ============================================================
   PokeMisteryRL
   STYLE REWORK
   CORE JS COMPATIBLE
   ============================================================ */

/* ============================================================
   01. RESET / BASE
   ============================================================ */

*,
*::before,
*::after{
    box-sizing:border-box;
}

html{
    min-height:100%;
    background:#050914;
}

body{
    min-height:100vh;

    margin:0;
    padding:10px;

    background:
        radial-gradient(
            circle at 50% 0%,
            #10213d 0%,
            #08111f 35%,
            #050914 75%
        );

    color:#f5f8ff;

    font-family:
        monospace,
        "Courier New",
        sans-serif;

    text-align:center;

    overflow-x:hidden;
}

button{
    appearance:none;

    border:1px solid #41658e;
    border-radius:8px;

    padding:8px 14px;
    margin:4px;

    background:
        linear-gradient(
            180deg,
            #294b78,
            #183252
        );

    color:#fff;

    font-family:inherit;
    font-size:12px;
    font-weight:bold;

    cursor:pointer;

    transition:
        transform .12s ease,
        background .12s ease,
        border-color .12s ease,
        box-shadow .12s ease;
}

button:hover{
    background:
        linear-gradient(
            180deg,
            #38679f,
            #21446f
        );

    border-color:#5d91c8;

    box-shadow:
        0 0 12px rgba(70,150,255,.18);
}

button:active{
    transform:scale(.96);
}

button.danger{
    background:
        linear-gradient(
            180deg,
            #8b3838,
            #602525
        );

    border-color:#b85b5b;
}

button.danger:hover{
    background:
        linear-gradient(
            180deg,
            #a84747,
            #742d2d
        );
}

/* ============================================================
   02. UTILITIES
   ============================================================ */

.hidden{
    display:none!important;
}

/* ============================================================
   03. MENU
   ============================================================ */

#menu{
    width:min(100%,450px);

    min-height:100vh;

    margin:0 auto;

    display:flex;

    flex-direction:column;

    align-items:center;
    justify-content:center;

    gap:8px;
}

#menu h1{
    margin:0 0 20px;

    color:#55d9ff;

    font-size:24px;
    letter-spacing:2px;

    text-shadow:
        0 0 8px rgba(0,220,255,.55),
        0 0 24px rgba(0,220,255,.2);
}

#menu button{
    min-width:210px;
}

/* ============================================================
   04. GAME
   ============================================================ */

#game{
    width:100%;
}

#gameBox{
    width:100%;
    max-width:450px;

    margin:0 auto;
}

/* ============================================================
   05. MAP WRAPPER
   ============================================================ */

.map-wrap{
    position:relative;

    width:100%;
    min-height:440px;

    padding:14px;

    overflow:hidden;

    background:
        radial-gradient(
            circle at 50% 20%,
            rgba(20,65,105,.4),
            transparent 55%
        ),
        #081525;

    border:1px solid #315579;
    border-radius:16px;

    box-shadow:
        inset 0 0 30px rgba(0,0,0,.35),
        0 8px 25px rgba(0,0,0,.25);
}

/* ============================================================
   MAP SVG
   ============================================================ */

#mapSvg{
    position:absolute;

    inset:0;

    width:100%;
    height:100%;

    pointer-events:none;

    z-index:0;
}

/* ============================================================
   MAP
   ============================================================ */

#map{
    position:relative;

    z-index:1;

    width:100%;
}

.map-row{
    display:flex;

    align-items:center;
    justify-content:center;

    gap:14px;

    margin:15px 0;
}

.node{
    position:relative;

    width:46px;
    height:46px;

    flex:0 0 46px;

    display:flex;
    align-items:center;
    justify-content:center;

    border-radius:50%;

    border:2px solid #315579;

    background:
        radial-gradient(
            circle,
            #182c45 0%,
            #0b1422 75%
        );

    color:#fff;

    font-size:20px;

    cursor:pointer;

    transition:
        transform .15s ease,
        box-shadow .15s ease,
        opacity .15s ease;
}

.node:hover{
    transform:scale(1.06);
}

.node.available{
    border-color:#ffd43b;

    background:
        radial-gradient(
            circle,
            #3b3505,
            #171600
        );

    box-shadow:
        0 0 7px #ffd43b,
        0 0 18px rgba(255,204,0,.45);

    transform:scale(1.12);
}

.node.current{
    border-color:#00e5ff;

    background:
        radial-gradient(
            circle,
            #063b47,
            #061b23
        );

    box-shadow:
        0 0 8px #00e5ff,
        0 0 20px rgba(0,229,255,.4);
}

.node.done{
    opacity:.45;
}

.node.locked{
    opacity:.22;

    pointer-events:none;
}

/* ============================================================
   MAP CONNECTIONS
   ============================================================ */

.map-line{
    stroke:#315579;

    stroke-width:2;

    opacity:.55;

    stroke-dasharray:6 5;

    stroke-linecap:round;
}

.map-line.available{
    stroke:#ffd43b;

    stroke-width:2.5;

    opacity:1;

    stroke-dasharray:6 5;

    stroke-linecap:round;
}

/* ============================================================
   06. BOTTOM CONTAINER
   ============================================================ */

#bottomContainer{
    width:100%;

    margin-top:8px;
    padding:8px;

    background:
        linear-gradient(
            145deg,
            #112746,
            #0a182c
        );

    border:1px solid #294b70;
    border-radius:16px;

    box-shadow:
        0 8px 20px rgba(0,0,0,.25),
        inset 0 1px 0 rgba(255,255,255,.035);
}

/* ============================================================
   07. MAIN HUD GRID
   ============================================================ */

.bottom-v8{
    width:100%;

    min-height:142px;

    display:grid;

        17fr
        59fr

}

}

    justify-content:center;

   ============================================================ */

.bf-team{

        repeat(3,1fr);

    gap:6px;

}

.team-label{

.poke-card{

}

.poke-name{
    overflow:hidden;

    text-overflow:ellipsis;
}

}

.mini-bar{
    height:5px;

    margin-top:3px;

    overflow:hidden;

    background:#000;

    border-radius:4px;
}

.mini-bar > div{
    height:100%;

    background:#28d67b;

    transition:width .25s ease;
}

/* ============================================================
   DAMAGE NUMBERS
   ============================================================ */

.dmg-num{
    position:absolute;

    left:50%;
    top:10px;

    z-index:10;

    transform:translateX(-50%);

    pointer-events:none;

    font-size:16px;
    font-weight:bold;

    animation:damageFloat .9s ease forwards;

    text-shadow:
        0 2px 3px #000;
}

.dmg-num.crit{
    font-size:20px;
}

.dmg-num.heal{
    font-size:16px;
}

@keyframes damageFloat{
    0%{
        opacity:1;
        transform:
            translate(-50%,0)
            scale(1);
    }

    100%{
        opacity:0;
        transform:
            translate(-50%,-35px)
            scale(1.15);
    }
}

/* ============================================================
   01. RESET / BASE
   ============================================================ */

*,
*::before,
*::after{
    box-sizing:border-box;
}

html{
    min-height:100%;
    background:#050914;
}

body{
    min-height:100vh;

    margin:0;
    padding:10px;

    background:
        radial-gradient(
            circle at 50% 0%,
            #10213d 0%,
            #08111f 35%,
            #050914 75%
        );

    color:#f5f8ff;

    font-family:
        monospace,
        "Courier New",
        sans-serif;

    text-align:center;

    overflow-x:hidden;
}

button{
    appearance:none;

    border:1px solid #41658e;
    border-radius:8px;

    padding:8px 14px;
    margin:4px;

    background:
        linear-gradient(
            180deg,
            #294b78,
            #183252
        );

    color:#fff;

    font-family:inherit;
    font-size:12px;
    font-weight:bold;

    cursor:pointer;

    transition:
        transform .12s ease,
        background .12s ease,
        border-color .12s ease,
        box-shadow .12s ease;
}

button:hover{
    background:
        linear-gradient(
            180deg,
            #38679f,
            #21446f
        );

    border-color:#5d91c8;

    box-shadow:
        0 0 12px rgba(70,150,255,.18);
}

button:active{
    transform:scale(.96);
}

button.danger{
    background:
        linear-gradient(
            180deg,
            #8b3838,
            #602525
        );

    border-color:#b85b5b;
}

button.danger:hover{
    background:
        linear-gradient(
            180deg,
            #a84747,
            #742d2d
        );
}

/* ============================================================
   02. UTILITIES
   ============================================================ */

.hidden{
    display:none!important;
}

/* ============================================================
   03. MENU
   ============================================================ */

#menu{
    width:min(100%,450px);

    min-height:100vh;

    margin:0 auto;

    display:flex;

    flex-direction:column;

    align-items:center;
    justify-content:center;

    gap:8px;
}

#menu h1{
    margin:0 0 20px;

    color:#55d9ff;

    font-size:24px;
    letter-spacing:2px;

    text-shadow:
        0 0 8px rgba(0,220,255,.55),
        0 0 24px rgba(0,220,255,.2);
}

#menu button{
    min-width:210px;
}

/* ============================================================
   04. GAME
   ============================================================ */

#game{
    width:100%;
}

#gameBox{
    width:100%;
    max-width:450px;

    margin:0 auto;
}

/* ============================================================
   05. MAP WRAPPER
   ============================================================ */

.map-wrap{
    position:relative;

    width:100%;
    min-height:440px;

    padding:14px;

    overflow:hidden;

    background:
        radial-gradient(
            circle at 50% 20%,
            rgba(20,65,105,.4),
            transparent 55%
        ),
        #081525;

    border:1px solid #315579;
    border-radius:16px;

    box-shadow:
        inset 0 0 30px rgba(0,0,0,.35),
        0 8px 25px rgba(0,0,0,.25);
}

/* ============================================================
   MAP SVG
   ============================================================ */

#mapSvg{
    position:absolute;

    inset:0;

    width:100%;
    height:100%;

    pointer-events:none;

    z-index:0;
}

/* ============================================================
   MAP
   ============================================================ */

#map{
    position:relative;

    z-index:1;

    width:100%;
}

.map-row{
    display:flex;

    align-items:center;
    justify-content:center;

    gap:14px;

    margin:15px 0;
}

.node{
    position:relative;

    width:46px;
    height:46px;

    flex:0 0 46px;

    display:flex;
    align-items:center;
    justify-content:center;

    border-radius:50%;

    border:2px solid #315579;

    background:
        radial-gradient(
            circle,
            #182c45 0%,
            #0b1422 75%
        );

    color:#fff;

    font-size:20px;

    cursor:pointer;

    transition:
        transform .15s ease,
        box-shadow .15s ease,
        opacity .15s ease;
}

.node:hover{
    transform:scale(1.06);
}

.node.available{
    border-color:#ffd43b;

    background:
        radial-gradient(
            circle,
            #3b3505,
            #171600
        );

    box-shadow:
        0 0 7px #ffd43b,
        0 0 18px rgba(255,204,0,.45);

    transform:scale(1.12);
}

.node.current{
    border-color:#00e5ff;

    background:
        radial-gradient(
            circle,
            #063b47,
            #061b23
        );

    box-shadow:
        0 0 8px #00e5ff,
        0 0 20px rgba(0,229,255,.4);
}

.node.done{
    opacity:.45;
}

.node.locked{
    opacity:.22;

    pointer-events:none;
}

/* ============================================================
   MAP CONNECTIONS
   ============================================================ */

.map-line{
    stroke:#315579;

    stroke-width:2;

    opacity:.55;

    stroke-dasharray:6 5;

    stroke-linecap:round;
}

.map-line.available{
    stroke:#ffd43b;

    stroke-width:2.5;

    opacity:1;

    stroke-dasharray:6 5;

    stroke-linecap:round;
}

/* ============================================================
   06. BOTTOM CONTAINER
   ============================================================ */

#bottomContainer{
    width:100%;

    margin-top:8px;
    padding:8px;

    background:
        linear-gradient(
            145deg,
            #112746,
            #0a182c
        );

    border:1px solid #294b70;
    border-radius:16px;

    box-shadow:
        0 8px 20px rgba(0,0,0,.25),
        inset 0 1px 0 rgba(255,255,255,.035);
}

/* ============================================================
   07. MAIN HUD GRID
   ============================================================ */

.bottom-v8{
    width:100%;

    min-height:142px;

    display:grid;

/* ============================================================
   12. BATTLE
   ============================================================ */

#battleFinal{
    width:100%;

    font-size:12px;
}

.bf-top{
    display:flex;

    gap:8px;

    margin-bottom:8px;
}

.bf-hp{
    flex:1;

    padding:5px;

    background:#03070c;

    border:1px solid #315579;
    border-radius:7px;
}

.bf-field{
    display:flex;

    align-items:center;
    justify-content:space-around;

    margin:8px 0;
    padding:12px;

    background:
        radial-gradient(
            ellipse at center,
            #112b45,
            #071321
        );

    border:1px solid #213e5d;
    border-radius:10px;
}

.bf-sprite{
    position:relative;
}

.bf-sprite img{
    width:72px;
    height:72px;

    object-fit:contain;

    image-rendering:pixelated;
}

.bf-sprite.hit{
    animation:hitShake .25s ease;
}

@keyframes hitShake{
    0%,100%{
        transform:translateX(0);
    }

    25%{
        transform:translateX(-6px);
    }

    75%{
        transform:translateX(6px);
    }
}

.bf-logRow{
    display:flex;

    gap:6px;

    align-items:stretch;
}

.bf-log{
    flex:1;

    height:60px;

    overflow:auto;

    padding:5px;

    background:#02050a;

    border:1px solid #1c334d;
    border-radius:7px;

    color:#d9e8f5;

    font-size:11px;

    text-align:left;
}

.bf-fleeBox{
    display:flex;

    align-items:center;
    justify-content:center;
}

.btn-flee{
    min-width:55px;

    padding:7px;

    background:#663434;
}

/* ============================================================
   BATTLE TEAM
   ============================================================ */

.bf-team{
    display:grid;

    grid-template-columns:
        repeat(3,1fr);

    gap:6px;

    margin-top:8px;
}

.team-label{
    grid-column:1/-1;

    color:#80cfff;

    font-size:10px;
    font-weight:bold;

    text-align:left;
}

.poke-card{
    min-width:0;

    padding:5px;

    background:#03070c;

    border:1px solid #294967;
    border-radius:8px;

    text-align:center;
}

.poke-card.empty{
    opacity:.5;
}

.poke-card img{
    width:40px;
    height:40px;

    object-fit:contain;

    image-rendering:pixelated;
}

.poke-name{
    overflow:hidden;

    font-size:9px;

    white-space:nowrap;
    text-overflow:ellipsis;
}

.poke-lv{
    margin-top:2px;

    font-size:9px;
}

.mini-bar{
    height:5px;

    margin-top:3px;

    overflow:hidden;

    background:#000;

    border-radius:4px;
}

.mini-bar > div{
    height:100%;

    background:#28d67b;

    transition:width .25s ease;
}

/* ============================================================
   DAMAGE NUMBERS
   ============================================================ */

.dmg-num{
    position:absolute;

    left:50%;
    top:10px;

    z-index:10;

    transform:translateX(-50%);

    pointer-events:none;

    font-size:16px;
    font-weight:bold;

    animation:damageFloat .9s ease forwards;

    text-shadow:
        0 2px 3px #000;
}

.dmg-num.crit{
    font-size:20px;
}

.dmg-num.heal{
    font-size:16px;
}

@keyframes damageFloat{
    0%{
        opacity:1;
        transform:
            translate(-50%,0)
            scale(1);
    }

    100%{
        opacity:0;
        transform:
            translate(-50%,-35px)
            scale(1.15);
    }
}

/* Schermata evoluzione */
.evolution-modal{
  max-width:390px !important;
  overflow:hidden;

  min-height:142px;
  display:grid;
  grid-template-columns:1fr 26px 20px 1fr;
  align-items:center;
  gap:3px;
  padding:12px 7px;
  border:1px solid rgba(104,222,255,.48);
  border-radius:12px;
  background:rgba(3,12,25,.55);
}
.evolution-form{
  display:flex;
  flex-direction:column;
  align-items:center;
  gap:5px;
  min-width:0;
  font-size:10px;
}

  width:78px;
  height:78px;
  object-fit:contain;
  image-rendering:pixelated;
}
.evolution-arrow{font-size:20px;color:#7fe9ff;font-weight:900}
.evolution-flash{font-size:22px;color:#fff4aa;animation:evoPulse 1s ease-in-out infinite}
.evolution-caption{margin:12px 0 6px;font-size:10px;opacity:.78}
.evolution-confirm{width:100%;margin:5px 0 0;background:linear-gradient(90deg,#00a8d6,#375dff) !important}
.evolution-modal.is-evolving .evolution-from{animation:evoLeave .85s ease-in forwards}
.evolution-modal.is-evolving .evolution-to{animation:evoArrive .85s ease-out forwards}
.evolution-modal.is-evolving .evolution-flash{animation:evoBurst .85s ease-out forwards}
.evolution-modal.is-evolving .evolution-arrow,
.evolution-modal.is-evolving .evolution-caption,
.evolution-modal.is-evolving .evolution-confirm{opacity:0;transition:opacity .15s ease}
.evolution-result{display:grid;justify-items:center;gap:12px}.evolution-result>img{width:120px;height:120px;object-fit:contain;image-rendering:pixelated}.evolution-result h2{margin:0;max-width:440px}.evolution-result .evolution-confirm{max-width:360px}
@keyframes evoPulse{50%{transform:scale(1.32);filter:drop-shadow(0 0 9px #fff4aa)}}
@keyframes evoLeave{0%{opacity:1;transform:scale(1)}100%{opacity:0;transform:scale(.3) rotate(-10deg)}}
@keyframes evoArrive{0%{opacity:.05;transform:scale(.25);filter:brightness(3)}65%{opacity:1;transform:scale(1.18);filter:brightness(2)}100%{opacity:1;transform:scale(1);filter:brightness(1)}}
@keyframes evoBurst{0%{transform:scale(.5);opacity:.4}45%{transform:scale(3.5);opacity:1;filter:drop-shadow(0 0 18px #fff)}100%{transform:scale(5);opacity:0}}
